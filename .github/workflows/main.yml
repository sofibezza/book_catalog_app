name: CI/CD - Book App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sofiadmin
          POSTGRES_PASSWORD: infinite123
          POSTGRES_DB: booktracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/app/requirements.txt

      - name: Debug Environment
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_SERVER: localhost
        run: |
          echo "Usuario detectado: $POSTGRES_USER"
          echo "Servidor: $POSTGRES_SERVER"
          echo "Python Path: $PYTHONPATH"
          echo "Directorio actual: $(pwd)"

      - name: Run Tests with Coverage
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          # Construcción de la URL de base de datos para evitar el usuario 'runner'
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          PROJECT_NAME: "Personal Book Tracker"
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/app/tests/ --cov=backend/app --cov-report=term-missing