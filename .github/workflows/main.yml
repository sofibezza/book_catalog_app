name: Python CI/CD - Book Tracker

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Levanta una base de datos temporal en la nube de GitHub para los tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sofiadmin
          POSTGRES_PASSWORD: infinite123
          POSTGRES_DB: booktracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/app/requirements.txt

      - name: Run Tests with Coverage
        env:
          # Inyecta los secretos guardados en github
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          PROJECT_NAME: "Personal Book Tracker"
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/app/tests/ --cov=backend/app --cov-report=term-missing