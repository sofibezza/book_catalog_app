services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # 1. Hot Reloading: Montamos el código local para no reconstruir la imagen en cada cambio
    volumes:
      - ./backend:/app  # Ajusta '/app' según tu WORKDIR en el Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobrescribimos el host de la DB para que apunte al nombre del servicio de docker
      - POSTGRES_SERVER=db 
    # 2. Resiliencia: La API no intenta arrancar hasta que la DB acepte conexiones reales
    depends_on:
      db:
        condition: service_healthy
    networks:
      - booktracker-network
    # Comando para desarrollo (recarga automática)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine # Alpine es más ligera (buena práctica)
    environment:
      POSTGRES_USER: ${POSTGRES_USER} # Fallback por si falta en .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - booktracker-network
    # 3. Healthcheck: Vital para orquestación. Verifica que Postgres esté listo.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sofiadmin} -d ${POSTGRES_DB:-booktracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - booktracker-network
    depends_on:
      - db

volumes:
  pgdata:

# 4. Networking: Aislamiento de red
networks:
  booktracker-network:
    driver: bridge